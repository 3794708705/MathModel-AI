[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mathmodel-ai"
version = "0.1.0"
description = "Traceable AI workflow foundation for mathematical modeling competitions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "charset-normalizer>=3.4,<4",
  "cryptography>=44.0.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "polars>=1.30,<2,!=1.44.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.25,<2",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
solver-local = [
  "numpy>=2.2,<3",
  "ortools>=9.12,<10",
  "scipy>=1.15,<2",
]
gurobi = [
  "gurobipy>=12,<14",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mathmodel_ai"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests spanning multiple application components",
  "postgres: tests requiring a migrated PostgreSQL database",
  "sandbox: tests requiring the local Docker sandbox image",
  "solver: tests requiring the Phase 4 solver sandbox image",
  "gurobi: optional tests requiring Gurobi and a valid runtime license",
  "schema: schema and serialization contract tests",
]

[tool.coverage.run]
branch = true
source = ["mathmodel_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["mathmodel_ai"]
