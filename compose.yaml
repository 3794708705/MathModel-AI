services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mathmodel
      POSTGRES_USER: mathmodel
      POSTGRES_PASSWORD: mathmodel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathmodel -d mathmodel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mathmodel-postgres:/var/lib/postgresql/data

volumes:
  mathmodel-postgres:

