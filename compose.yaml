services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mathmodel
      POSTGRES_USER: mathmodel
      POSTGRES_PASSWORD: mathmodel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathmodel -d mathmodel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mathmodel-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      MM_DATABASE_URL: postgresql+psycopg://mathmodel:mathmodel@postgres:5432/mathmodel
      MM_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:5174","http://127.0.0.1:5174"]'
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn mathmodel_ai.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mathmodel-var:/app/var

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mathmodel-postgres:
  mathmodel-var:
