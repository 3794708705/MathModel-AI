name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mathmodel
          POSTGRES_USER: mathmodel
          POSTGRES_PASSWORD: mathmodel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathmodel -d mathmodel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MM_ENVIRONMENT: test
      MM_DATABASE_URL: postgresql+psycopg://mathmodel:mathmodel@localhost:5432/mathmodel
      MM_TEST_DATABASE_URL: postgresql+psycopg://mathmodel:mathmodel@localhost:5432/mathmodel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=mathmodel_ai --cov-report=term-missing
